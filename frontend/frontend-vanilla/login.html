<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Idalia</title>
  
  
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html">
        <img src="img-index/logo-idalia.jpeg" alt="Logo Idalia" class="logo-img">
      </a>

      <!-- Botón hamburguesa para mobile -->
      <button class="menu-toggle" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Menú de navegación -->
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="carrito.html">Carrito</a></li>
          <li><a href="login.html" class="active">Iniciar Sesión</a></li>
          <li><a href="registro.html">Registrarse</a></li>
          <li><a href="#">Catalogo</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container auth-wrapper">
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-header">
          <h2>¡Hola de nuevo!</h2>
          <p>Ingresa a tu cuenta para gestionar tus compras</p>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="ejemplo@correo.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <div id="error-message" class="error-alert" style="display: none;" role="alert"></div>

          <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="auth-footer">
          <p>¿Aún no tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-container">
      <p>&copy; 2026 Proyecto Integrador. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
