<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Idalia</title>


  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
    <header>
        <div class="header-container">
          <a href="index.html">
            <img src="img-index/logo-idalia.jpeg" alt="Logo Idalia" class="logo-img">
          </a>
    
          <!-- Botón hamburguesa para mobile -->
          <button class="menu-toggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
          </button>
    
          <!-- Menú de navegación -->
          <nav class="navbar">
            <ul class="nav-links">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="carrito.html">Carrito</a></li>
              <li><a href="login.html" class="active">Iniciar Sesión</a></li>
              <li><a href="registro.html">Registrarse</a></li>
            </ul>
          </nav>
        </div>
      </header>

  <main class="main-container auth-wrapper">
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Crear Cuenta</h2>
          <p>Únete a nuestra comunidad en unos simples pasos</p>
        </div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input 
              type="text" 
              id="nombre" 
              name="nombre" 
              placeholder="Juan Pérez" 
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="ejemplo@correo.com" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required
              autocomplete="new-password"
            >
          </div>
          <div class="form-group">
             <label for="rol"> seleccione rol</label>
             <select  id="rol">
                <option value="user" selected> comun</option>
                <option value="admin"> administrador</option>
             </select>
          </div>

          <!-- Mensajes de feedback -->
          <div id="register-error-message" class="error-alert" style="display: none;" role="alert"></div>
          <div id="register-success-message" class="success-alert" style="display: none;" role="status"></div>

          <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>

        <div class="auth-footer">
          <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Proyecto Integrador. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="./js/registro.js"></script>
</body>
</html>
