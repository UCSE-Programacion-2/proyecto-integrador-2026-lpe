<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idalia - Panel de Administración</title>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style-backoffice.css">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <img src="./img-index/logo-idalia.jpeg" alt="Idalia Accesorios" class="logo-img">
            </a>
            
            <button class="menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="navbar">
                <ul>
                    <li><a href="./index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                    <li><a href="./Backoffice.html" class="active">Administrar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="section-container">
            <h1 class="section-titulo">Panel de Control</h1>

            <div class="admin-dashboard-layout">
                
                <section class="admin-form-section">
                    <div class="admin-card">
                        <h2 id="form-title" class="card-form-title">Agregar Nuevo Producto</h2>
                        
                        <!-- Formulario con ID e campo de ID oculto para edición -->
                        <form id="product-form" class="admin-form">
                            <input type="hidden" id="prod-id">

                            <div class="form-group">
                                <label for="prod-name">Nombre del Producto</label>
                                <input type="text" id="prod-name" placeholder="Ej. Cuaderno Gatitos" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-decripcion">Descripción</label>
                                <input type="text" id="prod-descripcion" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="prod-categoria">Categoría</label>
                                <select id="prod-categoria" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option value="cuaderno">Cuaderno</option>
                                    <option value="accesorio">Accesorio</option>
                                    <option value="libreria">Librería</option>
                                    <option value="Papeleria Vintage"> Papeleria vintage</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="prod-cantidad">Cantidad</label>
                                <input type="number" id="prod-cantidad" required>
                            </div>
                            <div class="form-group">
                                <label for="prod-precio">Precio ($)</label>
                                <input type="number" id="prod-precio" placeholder="Ej. 3500" required>
                            </div>

                            <div class="form-group">
                                <label for="prod-img">Ruta o URL de Imagen</label>
                                <input type="text" id="prod-img" placeholder="./img-index/cuaderno.jpeg">
                            </div>

                            <div id="admin-message" style="display: none; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem;"></div>

                            <button type="submit" id="btn-guardar" class="btn-primario btn-block">Guardar Producto</button>
                            <button type="button" id="btn-cancelar" class="btn-secundario btn-block" style="display: none; margin-top: 0.5rem;">Cancelar Edición</button>
                        </form>
                    </div>
                </section>

                <section class="admin-table-section">
                    <div class="admin-card table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <!-- tbody dinámico que se llenará con JS -->
                            <tbody id="admin-products-table">
                                <tr>
                                    <td colspan="5" style="text-align: center;">Cargando productos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-brand">
                <p class="footer-logo-text">Idalia</p>
                <p>Accesorios con estilo</p>
            </div>
            <div class="footer-links">
                <h3>Navegación</h3>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Productos</a></li>
                </ul>
            </div>
            <div class="footer-derechos">
                <p>&copy; 2026 Idalia. Todos los derechos reservados para LPE.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts modularizados -->
    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
